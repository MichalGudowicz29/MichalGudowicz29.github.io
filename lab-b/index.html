<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Michał Gudowicz (55684) - IS LAB B</title>

    <link rel="stylesheet" href="styles.css" type="text/css">
    <script src="scripts.js" defer></script>
</head>
<body>

<!-- Glowny blok gdzie bedzie TODO list -->
<div id="main-box">
    <!-- Wyszukiwarka -->
    <div id="search-bar">
        <label>
            <input id="search-input" type="text" placeholder="Wyszukaj zadanie...">
        </label>
    </div>
    <!-- Blok z zadaniami -->
    <div id="tasks-list">
        <ul> </ul>
    </div>

    <div id="add-task">
        <input id="new-task-input" type="text" placeholder="Dodaj nowe zadanie...">
        <input id="new-task-date" type="date">
        <input id="new-task-note" type="text" placeholder="Dodaj notatkę...">
        <button id="add-task-button" type="button">Dodaj</button>
    </div>
</div>



</body>
</html>
