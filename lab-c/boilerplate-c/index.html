<!doctype html>

    <script src="scripts.js" defer></script>

<body>
    <h1>Weather App</h1>
    <form id="weather-form">
        <label for="location">Lokalizacja:</label>
        <input
            type="text"
            id="location"
            name="location"
            placeholder="Miasto, Państwo"
            required
        >
        <button type="submit">Sprawdź</button>
    </form>
    <p id="weather-status" role="status"></p>
</body>
